name: Release

# Publishes on a version tag. Both registries authenticate via OIDC
# ("trusted publishing"): GitHub mints a short-lived identity token for
# this specific workflow in this specific repo, and the registry trades
# it for a one-shot publish. No long-lived npm or PyPI token exists to
# be leaked, pasted into a chat log, or committed - which is the failure
# mode this project exists to eliminate, so using tokens to ship it
# would be a poor advertisement.
#
# One-time setup, per package, before the first run:
#   npm   - npmjs.com > package > Settings > Trusted Publisher > GitHub
#           Actions; repo secrefs/secrefs, workflow release.yml
#   PyPI  - pypi.org/manage/account/publishing/ > add a *pending*
#           publisher (project `secrefs`, owner secrefs, repo
#           secrefs, workflow release.yml). "Pending" is what lets a
#           project that does not exist yet be claimed by its first
#           trusted publish, so no token is needed even the first time.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Never publish something that hasn't passed the same gate as main.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC; without it npm falls back to a token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing landed in npm 11.5.1; the version bundled with
      # Node 22 is older, so pin a known-good one rather than inherit it.
      - run: npm install -g npm@^11.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secrefs/node build

      - name: Check the tag matches the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/node/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish @secrefs/node
        working-directory: packages/node
        run: npm publish --access public ${{ inputs.dry_run && '--dry-run' || '' }}

      # The alias pins an exact version of the package above, so it can
      # only be published once that version is actually resolvable.
      - name: Wait for @secrefs/node to be resolvable
        if: ${{ !inputs.dry_run }}
        run: |
          V=$(node -p "require('./packages/node/package.json').version")
          for i in $(seq 1 30); do
            if npm view "@secrefs/node@$V" version >/dev/null 2>&1; then
              echo "resolvable after $((i*10))s"; exit 0
            fi
            sleep 10
          done
          echo "::error::@secrefs/node@$V not resolvable after 5 minutes"
          exit 1

      # The alias depends on @secrefs/node as `workspace:*` in the repo,
      # so the lockfile resolves it locally and the version can be bumped
      # before it exists on the registry. npm publish would ship that
      # literal string, so it is rewritten to the concrete version here -
      # immediately before publishing, and never committed.
      - name: Pin the alias to the version just published
        run: |
          node -e "
            const fs = require('fs');
            const version = require('./packages/node/package.json').version;
            const p = './packages/npm-alias/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.dependencies['@secrefs/node'] = version;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('alias now depends on @secrefs/node@' + version);
          "

      - name: Publish the secrefs alias
        working-directory: packages/npm-alias
        run: npm publish --access public ${{ inputs.dry_run && '--dry-run' || '' }}

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pipx install poetry

      - name: Check the tag matches the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(poetry version -s)
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match pyproject $PKG"
            exit 1
          fi
        working-directory: packages/python
        if: startsWith(github.ref, 'refs/tags/')

      - run: poetry build
        working-directory: packages/python

      # gh-action-pypi-publish reads the OIDC token itself - there is no
      # password/token input to set, which is the point.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
          print-hash: true
          attestations: true
        if: ${{ !inputs.dry_run }}
